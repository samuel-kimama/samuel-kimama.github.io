name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compute dependency hash
        id: dep-hash
        run: |
          echo "hash=$(jq -j '{dependencies, devDependencies, overrides}' package.json | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.dep-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # astro-pdf downloads chrome into node_modules/.astro/chrome at build time.
      # We cache that path separately so the download is skipped on subsequent runs.
      # We always wipe it after restoring node_modules because a previous failed run
      # may have left the folder structure without the binary, which causes
      # @puppeteer/browsers to error ("folder exists but executable missing").
      - name: Clear chrome from node_modules cache
        run: rm -rf node_modules/.astro/chrome

      - name: Cache Chromium binary
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/chrome
          key: ${{ runner.os }}-astro-chrome-${{ steps.dep-hash.outputs.hash }}

      - name: Verify Chromium binary
        run: |
          if [ -d node_modules/.astro/chrome ] && ! find node_modules/.astro/chrome -name "chrome" -type f 2>/dev/null | grep -q .; then
            rm -rf node_modules/.astro/chrome
          fi

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://samuel-kimama.github.io' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
