name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compute dependency hash
        id: dep-hash
        run: |
          echo "hash=$(jq -j '{dependencies, devDependencies, overrides}' package.json | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.dep-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          EMAIL: ${{ secrets.EMAIL }}
          LINKEDIN: ${{ secrets.LINKEDIN }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || vars.PUBLIC_SITE_URL || 'https://samuel-kimama.github.io' }}
          # astro-pdf uses puppeteer to print the resume PDF. Pointing puppeteer
          # at the system Chrome avoids downloading a browser at build time —
          # ubuntu-latest has google-chrome pre-installed.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
