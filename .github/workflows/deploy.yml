name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compute dependency hash
        id: dep-hash
        run: |
          echo "hash=$(jq -j '{dependencies, devDependencies, overrides}' package.json | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.dep-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # astro-pdf uses puppeteer to generate the resume PDF during build.
      # ubuntu-latest has no browser pre-installed, so puppeteer tries to
      # download one mid-build and races against the build completing — the
      # PDF never makes it into dist/. Pre-installing and caching chrome
      # (keyed to dep hash so it refreshes when puppeteer updates, but not
      # on every version bump) prevents that race and avoids re-downloading.
      - name: Cache Puppeteer browser
        id: cache-puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ steps.dep-hash.outputs.hash }}

      - name: Install Chromium
        run: |
          if ! find ~/.cache/puppeteer -name "chrome" -type f 2>/dev/null | grep -q .; then
            rm -rf ~/.cache/puppeteer/chrome
            npx puppeteer browsers install chrome
          fi

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://samuel-kimama.github.io' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
