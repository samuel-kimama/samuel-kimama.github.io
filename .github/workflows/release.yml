name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute release
        id: release
        run: |
          # Skip if this commit is itself a version bump
          if git log -1 --pretty=%s | grep -qE '^chore: release v'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+${LAST_TAG}..HEAD}"
          COMMITS=$(git log ${RANGE:-HEAD} --pretty=format:"%s")

          # Skip if no releasable commits (only build/chore)
          RELEASABLE=$(echo "$COMMITS" | grep -vE '^(build|chore)(\(.+\))?[!:]' | grep -E '^[a-z]+(\(.+\))?[!:]' || true)
          if [ -z "$RELEASABLE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine bump type
          if echo "$COMMITS" | grep -qE '^.+!:|BREAKING CHANGE'; then
            BUMP=major
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          CURRENT="${LAST_TAG#v}"
          CURRENT="${CURRENT:-0.1.0}"
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          case $BUMP in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac

          echo "version=${MAJ}.${MIN}.${PAT}" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Build changelog
        if: steps.release.outputs.skip != 'true'
        id: changelog
        run: |
          RANGE="${{ steps.release.outputs.range }}"
          LOG="${RANGE:-HEAD}"

          section() {
            local title="$1"; shift
            local lines=""
            for type in "$@"; do
              while IFS= read -r msg; do
                [ -n "$msg" ] && lines+="- ${msg}"$'\n'
              done < <(git log $LOG --pretty=format:"%s" | grep -E "^${type}(\(.+\))?:" | sed -E "s/^[^:]+(\([^)]+\))?: //")
            done
            [ -n "$lines" ] && printf "### %s\n%s\n" "$title" "$lines"
          }

          {
            echo "notes<<EOF"
            section "Features"       feat
            section "Bug Fixes"      fix
            section "Performance"    perf
            section "Refactors"      refactor
            section "Documentation"  docs
            section "Styles"         style
            section "Tests"          test
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Bump version and tag
        if: steps.release.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.notes }}"
