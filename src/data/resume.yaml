projects:
  - name: pm-loop
    tagline: CI loop where one agent triages another agent's code review.
    description: Used in CI across multiple projects
    start: 2026-03
    highlights:
      - "GitHub Action running Claude as a PM partner whenever a Codex reviewer bot comments on a PR: fixes real bugs, files tickets for out-of-scope concerns, and pushes back on premature or style-only feedback."
      - Persists triage state across runs and caps iterations, so the fix → re-review loop terminates instead of spinning.
  - name: QueQue
    tagline: Natural language to shell commands via LLM API, triggered with `??` pasted right back into your terminal.
    href: https://github.com/k-leumas/queque
    start: 2026-05
    highlights:
      - "Prompt and output design for a destructive surface: generated commands are pasted to the prompt line for review, never auto-executed."
      - CLI distributed via Homebrew tap, Zsh plugin, and Zellij integration.
      - Designed for interrupted workflows. Queue now, run when unblocked.

  - name: Etch
    tagline: One-click marking via hover handle — jump back right back to the block section you bookmarked from anywhere.
    href: https://k-leumas.github.io/etch-extension/
    start: 2026-03
    highlights:
      - Selectorless, geometry-based architecture keeps bookmarks resilient to UI changes across platforms you do not control.
      - Browser extension shipped on Chrome and Firefox; supports ChatGPT, Claude, Gemini, Copilot, Perplexity, Grok, and Mistral.
      # - MCP server exposing bookmarked context to other tools.
      # - FTS5 SQLite search layer with bm25 ranking and owner-scoped filtering.



