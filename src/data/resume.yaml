  summary: >
    Founding frontend engineer, patent-holder, 16 years in, usually the first or sole frontend lead on the team. As founding UI engineer at WitnessAI, I designed the browser-side interception layer for live AI traffic, now covered by US patent 12,587,529; at Southwest Airlines I decomposed a legacy monolith into Single-SPA micro-frontends; and on a B2B SaaS analytics platform I cut TTFB by 67%. I start with the user, architect the platform layer (design systems, BFFs, migrations), and make the tradeoff calls that keep product moving.

core_strengths:
  - Starting from the user problem and customer context, translating both into system constraints
  - Product shaping with PM, design, and ML, making tradeoffs legible to non-engineers
  - System design and honest tradeoff calls across scope, speed, and long-term complexity
  - Managing complexity in long-lived codebases via migrations, decomposition, and boundaries that hold
  - React + TypeScript architecture for multi-app monorepos
  - Micro-frontend boundaries (Single-SPA) and BFF contracts (GraphQL)
  - Design systems and component APIs that survive team scale
  - "URL-driven state: shareable deep links and reload-safe workflows"
  - Performance budgets, Core Web Vitals, and accessibility via semantic HTML and focus management

